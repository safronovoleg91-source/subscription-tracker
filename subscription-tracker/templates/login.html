{% extends "base.html" %}
{% block title %}Вход — SubTracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <!-- Блок для показа ошибок -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- ФОРМА ВХОДА -->
        <div class="card shadow-sm" id="loginCard">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🥒 Вход</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label" for="loginUsername">Логин</label>
                        <input type="text" class="form-control" id="loginUsername" placeholder="username"
                               autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="loginPassword">Пароль</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <small>Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a></small>
                </p>
            </div>
        </div>

        <!-- ФОРМА РЕГИСТРАЦИИ (скрыта) -->
        <div class="card shadow-sm d-none" id="registerCard">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">🥒 Регистрация</h3>
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label" for="regUsername">Логин</label>
                        <input type="text" class="form-control" id="regUsername" placeholder="username"
                               autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="regPassword">Пароль (минимум 6 символов)</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="••••••"
                               autocomplete="new-password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <small>Уже есть аккаунт? <a href="#" id="showLogin">Войти</a></small>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
